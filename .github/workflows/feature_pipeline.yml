name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        city: [lahore]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python pipelines/feature_pipeline.py ${{ matrix.city }}

      - name: Alert on failure
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_PASSWORD: ${{ secrets.ALERT_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          sender = os.getenv("ALERT_EMAIL")
          password = os.getenv("ALERT_PASSWORD")
          recipient = os.getenv("ALERT_TO")

          city = "${{ matrix.city }}"
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if not all([sender, password, recipient]):
              print("Email secrets not set - skipping alert")
              raise SystemExit(0)

          msg = MIMEText(
              f"""Feature pipeline failed for city: {city}

          Run URL: {run_url}

          Please check the GitHub Actions logs.
          """
          )

          msg["Subject"] = f"Pearls AQI - Pipeline Failed ({city})"
          msg["From"] = sender
          msg["To"] = recipient

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(sender, password)
              server.sendmail(sender, [recipient], msg.as_string())

          print("Alert email sent!")
          PY