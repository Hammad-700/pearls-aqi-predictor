name: Training Pipeline (Daily)

on:
  schedule:
    # 19:00 UTC = 00:00 PKT
    - cron: "15 19 * * *"
  workflow_dispatch:

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python pipelines/training_pipeline.py

      - name: Alert on failure
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_PASSWORD: ${{ secrets.ALERT_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          sender = os.getenv("ALERT_EMAIL")
          password = os.getenv("ALERT_PASSWORD")
          recipient = os.getenv("ALERT_TO")

          if not all([sender, password, recipient]):
              print("Email secrets not set - skipping alert")
              raise SystemExit(0)

          msg = MIMEText(
              """Pearls AQI training pipeline failed.

          Please check the GitHub Actions logs for details.
          """
          )

          msg["Subject"] = "Pearls AQI - Training Failure Alert"
          msg["From"] = sender
          msg["To"] = recipient

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(sender, password)
              server.sendmail(
                  sender,
                  [recipient],
                  msg.as_string()
              )

          print("Alert email sent!")
          PY